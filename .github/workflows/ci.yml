name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    # The dev toolchain (Strauss, PHPStan 2, PHPUnit 9) requires PHP 8, so the
    # quality gates run there. The plugin's own PHP 7.4 floor is enforced by
    # PHPCompatibilityWP inside phpcs.xml (testVersion 7.4-), which runs here.
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3' ]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint (PHPCS / WPCS)
        run: composer run lint

      - name: Analyse (PHPStan level 5)
        run: composer run analyze

      - name: Unit tests (PHPUnit)
        run: vendor/bin/phpunit

  integration:
    # The unit suite runs against doubles, which is exactly why a FULLTEXT probe
    # that MySQL rejects outright once passed a fully green build. This job runs
    # the installer's real DDL at a real server. It is the only gate that can
    # catch that class of defect.
    name: Integration ${{ matrix.db.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - { name: 'MySQL 8.0',    image: 'mysql:8.0' }
          - { name: 'MySQL 5.7',    image: 'mysql:5.7' }
          - { name: 'MariaDB 10.6', image: 'mariadb:10.6' }

    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mysqli
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Integration tests against ${{ matrix.db.name }}
        env:
          LICENSIO_KB_TEST_DB_HOST: 127.0.0.1
          LICENSIO_KB_TEST_DB_PORT: 3306
          LICENSIO_KB_TEST_DB_USER: root
          LICENSIO_KB_TEST_DB_PASS: root
        # The suite skips itself when no database is reachable, and a skipped
        # suite still reports success. Without the grep this job would go green
        # while proving nothing, which is the exact failure it exists to catch.
        run: |
          set -o pipefail
          vendor/bin/phpunit --testsuite Integration | tee /tmp/integration.log
          if grep -qiE "skipped|no tests executed" /tmp/integration.log; then
            echo "::error::Integration suite skipped - the database was not reachable."
            exit 1
          fi

  js:
    name: JavaScript build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Node 22 bundles npm 10, but the lockfile is written by the npm pinned in
      # packageManager. Same Node, different npm resolves the nested vite that
      # @wordpress/stylelint-config pulls in differently, and npm ci then reports
      # the lockfile as out of sync. Pin both halves, not just Node.
      - name: Use the pinned npm
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install npm dependencies
        run: npm ci

      - name: Lint (ESLint / wp-scripts)
        run: npm run lint:js

      - name: Build the admin apps and blocks
        run: npm run build

  release:
    # Everything above proves the code is correct. This job proves the thing we
    # actually ship is correct, which is a different question: the free artifact
    # must contain no pro/ path and no SLSWC or WooCommerce symbol, the version
    # must agree in all four places it is written, and every translatable string
    # must carry the text domain.
    name: Release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          # WP-CLI generates the .pot. bin/build-release.sh can fall back to
          # downloading wp-cli.phar, but installing it here keeps the build off
          # the network.
          tools: composer:v2, wp-cli

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Same reasoning as the js job: Node 22 bundles npm 10 and the lockfile is
      # written by the npm named in packageManager, so both halves are pinned.
      - name: Use the pinned npm
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install npm dependencies
        run: npm ci

      # A gate that cannot fail is worse than no gate: it turns an unchecked
      # assumption into a false assurance. This runs each release gate against
      # fixtures that violate it and against fixtures that only look like they
      # do, so a gate stuck green and a gate stuck red both fail here.
      - name: Prove the release gates still fail on a violation
        run: bash bin/check-gates-selftest.sh

      # Runs the version, text domain and free/pro boundary gates against the
      # real tree on the way to producing both zips.
      - name: Build both release artifacts
        run: bash bin/build-release.sh --output "${RUNNER_TEMP}/release"

      # Costs nothing once dist/ exists, and is the only thing that proves
      # --dry-run reports without writing.
      - name: Dry run reports without publishing
        run: |
          bash bin/build-release.sh --dry-run --skip-build
          if [ -e releases ]; then
            echo "::error::--dry-run wrote into releases/."
            exit 1
          fi

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release/*.zip
          if-no-files-found: error

  e2e:
    # The unit and integration suites never load a browser, so redirects, menus
    # and the Vue apps are only proven against a real WordPress here. The site
    # runs the wporg zip the release job built, not the working tree, so this is
    # the plugin as it ships, on plain permalinks with seeded content.
    name: End-to-end (Playwright)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Same reasoning as the js job: the lockfile is written by the npm named
      # in packageManager.
      - name: Use the pinned npm
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install npm dependencies
        run: npm ci

      - name: Download the release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ${{ runner.temp }}/release

      - name: Install Playwright browsers
        run: npm run test:install

      # Boots WordPress with @wordpress/env, installs the zip, switches to plain
      # permalinks and seeds content, then hands the specs their variables.
      - name: Start a disposable WordPress
        run: bash bin/e2e-env.sh start "${RUNNER_TEMP}/release/licensio-knowledge-base-wporg.zip" >> "$GITHUB_ENV"

      # Every spec skips itself when its site variables are missing, and a
      # skipped suite still reports success. The grep turns a skip, or a test
      # that only passed on retry, into a failure.
      - name: End-to-end tests (Playwright)
        run: |
          set -o pipefail
          npx playwright test --reporter=list,github,html | tee /tmp/e2e.log
          if grep -qE "^ +[0-9]+ (skipped|flaky)|No tests found" /tmp/e2e.log; then
            echo "::error::End-to-end specs were skipped or flaky."
            exit 1
          fi

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
