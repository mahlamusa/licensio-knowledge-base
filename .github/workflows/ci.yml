name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    # The dev toolchain (Strauss, PHPStan 2, PHPUnit 9) requires PHP 8, so the
    # quality gates run there. The plugin's own PHP 7.4 floor is enforced by
    # PHPCompatibilityWP inside phpcs.xml (testVersion 7.4-), which runs here.
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3' ]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint (PHPCS / WPCS)
        run: composer run lint

      - name: Analyse (PHPStan level 5)
        run: composer run analyze

      - name: Unit tests (PHPUnit)
        run: vendor/bin/phpunit

  integration:
    # The unit suite runs against doubles, which is exactly why a FULLTEXT probe
    # that MySQL rejects outright once passed a fully green build. This job runs
    # the installer's real DDL at a real server. It is the only gate that can
    # catch that class of defect.
    name: Integration ${{ matrix.db.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - { name: 'MySQL 8.0',    image: 'mysql:8.0' }
          - { name: 'MySQL 5.7',    image: 'mysql:5.7' }
          - { name: 'MariaDB 10.6', image: 'mariadb:10.6' }

    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          extensions: mysqli
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Integration tests against ${{ matrix.db.name }}
        env:
          LISENSIO_KB_TEST_DB_HOST: 127.0.0.1
          LISENSIO_KB_TEST_DB_PORT: 3306
          LISENSIO_KB_TEST_DB_USER: root
          LISENSIO_KB_TEST_DB_PASS: root
        # The suite skips itself when no database is reachable, and a skipped
        # suite still reports success. Without the grep this job would go green
        # while proving nothing, which is the exact failure it exists to catch.
        run: |
          set -o pipefail
          vendor/bin/phpunit --testsuite Integration | tee /tmp/integration.log
          if grep -qiE "skipped|no tests executed" /tmp/integration.log; then
            echo "::error::Integration suite skipped - the database was not reachable."
            exit 1
          fi

  js:
    name: JavaScript build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      # Node 22 bundles npm 10, but the lockfile is written by the npm pinned in
      # packageManager. Same Node, different npm resolves the nested vite that
      # @wordpress/stylelint-config pulls in differently, and npm ci then reports
      # the lockfile as out of sync. Pin both halves, not just Node.
      - name: Use the pinned npm
        run: npm i -g "npm@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install npm dependencies
        run: npm ci

      - name: Lint (ESLint / wp-scripts)
        run: npm run lint:js

      - name: Build the admin apps and blocks
        run: npm run build

      # Playwright is configured here but has no specs until the consumer
      # issues land, so this runs with --pass-with-no-tests. It is still worth
      # running: without it nothing ever proves playwright.config.ts parses or
      # that the harness every sub-issue inherits actually starts.
      - name: Install Playwright browsers
        run: npm run test:install

      - name: End-to-end tests (Playwright)
        run: npm run test
